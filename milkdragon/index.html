<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>加载中…</title>
<meta name="theme-color" content="#fff1cf">
<meta name="description" content="">
<meta property="og:type" content="website">
<meta property="og:title" content="秋日手记">
<meta property="og:description" content="一些照片，一段声音，和一封写给你的短信。">
<meta property="og:image" content="assets/piggy.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="boot-loader" id="bootLoader" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="progress" aria-hidden="true"><i id="progressBar"></i></div>

<article id="app">
  <header class="hero" id="hero">
    <div class="hero__scrim" aria-hidden="true"></div>
    <div class="hero__inner">
      <p class="hero__kicker" id="heroKicker"></p>
      <h1 class="hero__title" id="heroTitle"></h1>
      <p class="hero__sub" id="heroSub"></p>
      <p class="hero__meta" id="heroMeta"></p>
    </div>
    <div class="hero-wave" aria-hidden="true">
      <svg viewBox="0 0 1440 44" preserveAspectRatio="none">
        <path d="M0,22 C240,44 480,0 720,22 C960,44 1200,0 1440,22 L1440,44 L0,44 Z"/>
      </svg>
    </div>
  </header>

  <main class="prose" id="content"></main>

  <footer class="footer">
    <div class="qrbox" id="qrbox" hidden>
      <img id="qrImg" alt="本页二维码" width="132" height="132" loading="lazy">
      <div class="qrbox__text">
        <strong>扫码打开这一页 ✨</strong>
        <span id="qrNote">手机相机对着二维码扫一下即可。</span>
        <button class="copybtn" id="copyBtn" type="button">复制链接</button>
      </div>
    </div>
    <p class="footer__note" id="footerNote"></p>
    <p class="footer__sig">Made with GitHub Pages
      <button class="relock" id="relockBtn" type="button" title="重新上锁" aria-label="重新上锁">🔒</button>
    </p>
  </footer>
</article>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox__close" id="lbClose" type="button" aria-label="关闭">×</button>
  <img id="lbImg" alt="">
  <p id="lbCap"></p>
</div>

<button class="to-top" id="toTop" type="button" aria-label="回到顶部">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M6 14l6-6 6 6" fill="none" stroke="currentColor" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<div class="toast" id="toast" hidden></div>

<div class="lock" id="lock" hidden>
  <div class="lock__card" id="lockCard">
    <svg class="lock__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3a4.5 4.5 0 0 0-4.5 4.5V10H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1.5V7.5A4.5 4.5 0 0 0 12 3zm-2.5 4.5a2.5 2.5 0 0 1 5 0V10h-5V7.5zM12 13a1.6 1.6 0 0 1 .9 2.92V17.4a.9.9 0 0 1-1.8 0v-1.48A1.6 1.6 0 0 1 12 13z"/>
    </svg>
    <h2 class="lock__title">输入密码</h2>
    <p class="lock__desc">这一页已加密，输入访问密码后即可查看。</p>
    <form id="lockForm">
      <input class="lock__input" id="lockInput" type="password"
             autocomplete="off" inputmode="text" placeholder="访问密码">
      <button class="lock__btn" id="lockBtn" type="submit">解锁</button>
    </form>
    <p class="lock__status" id="lockStatus" hidden></p>
    <p class="lock__err" id="lockErr" hidden></p>
  </div>
</div>

<script src="content.js"></script>
<!-- 本地明文副本：只在本地存在（不上传云端）。云端此文件 404，走加密流程 -->
<script src="content.local.js"></script>
<script src="js/crypto.js"></script>
<script src="js/render.js"></script>
<script>
/* 加载动画保险丝：不管脚本新旧，锁屏出现或内容渲染后必定收起 */
(function () {
  var n = 0;
  var t = setInterval(function () {
    var b = document.getElementById("bootLoader");
    var done = !b || document.querySelector(".lock.is-open") ||
               (document.getElementById("content") && document.getElementById("content").childElementCount > 0);
    if (done || ++n > 20) {
      clearInterval(t);
      if (b) { b.classList.add("is-done"); setTimeout(function () { b.remove(); }, 350); }
    }
  }, 300);
})();
</script>
</body>
</html>
